apiVersion: 1

deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: server
    orgId: 1
    uid: prometheus
    url: http://localhost:9090
    jsonData:
      timeInterval: 10s
      queryTimeout: 60s
      httpMethod: POST
    version: 1
    editable: true
    isDefault: true 