modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4
      valid_status_codes: [200,201,202,204]
      valid_http_versions: ["HTTP/1.0","HTTP/1.1","HTTP/2.0"]
      tls_config:
        insecure_skip_verify: true
      headers:
        Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" 